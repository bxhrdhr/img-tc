<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 在线托管</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fb 0%, #eef2f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .error-card {
            text-align: center;
            background: white;
            padding: 48px 32px;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 { font-size: 6rem; margin: 0; color: #3b82f6; }
        h2 { color: #1e293b; margin: 16px 0 8px; }
        p { color: #64748b; margin-bottom: 24px; }
        a {
            background: #0f172a;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover { background: #1e293b; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>页面迷路了</h2>
        <p>你访问的地址不存在，<br>可能是链接有误或文件已被移动。</p>
        <a href="https://woain.cc.cd/">返回首页</a>
    </div>
</body>
</html>
