<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            
            background-color: #1a1a2e;
            
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            color: #fff;
        }


        .quote {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 24px;
            margin-bottom: 60px;
        
            background: linear-gradient(90deg, #ff7eb3, #ff758c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
            letter-spacing: 1px;
        }

        
        .content {
            max-width: 600px;
            margin-bottom: 50px;
        }

        .content p {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 20px;
            color: #c5c6c7; 
            line-height: 1.8;
            margin-bottom: 10px;
        }

        
        .divider {
            width: 80%;
            max-width: 400px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff7eb3, transparent);
            margin-bottom: 50px;
        }
        .btn-home {
            display: inline-block;
            padding: 15px 50px;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 24px;
            color: #ff7eb3; 
            text-decoration: none;
            border: 1px solid rgba(255, 126, 179, 0.3);
            border-radius: 50px;
            transition: all 0.3s ease;
            
            box-shadow: 0 0 15px rgba(255, 126, 179, 0.2);
            cursor: pointer;
            outline: none;
        }

        .btn-home:hover {
            background-color: rgba(255, 126, 179, 0.1);
            box-shadow: 0 0 25px rgba(255, 126, 179, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="quote">后来，错过也成了人间常态。</div>

        
        <div class="content">
            互联网是一片海洋，
            网站犹如一座座孤岛漂浮在其上，
            唯有超链接将它们联系起来。
        </div>

        
        <div class="divider"></div>

        
        <a href="https://woain.cc.cd" class="btn-home">首页</a>
    </div>

</body>
</html>
